; Sterowanie 2x SG90 z Cardputer ADV
; Build:  pio run          -> .pio/build/cardputer/firmware.bin  (ten plik wgrywasz Launcherem)
; UWAGA: NIE uzywaj "pio run -t upload" - nadpisze Launcher.

[env:cardputer]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Cardputer@^1.1.0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
